<script type="text/javascript" src="{{ ACE_URL }}/ace.js"></script>
{{ form.media.js }}
{% compress js %}
    <script type="text/javascript">
        $(function () {
            function format(state) {
                if (!state.id) return state.text; // optgroup
                return state.text;
            }

            window.previous_template = '';

            function update_language_template() {
                var source = $('textarea#id_source');
                if (source.val() == window.previous_template.replace(/\r/g, '') || source.val() == '') {
                    var lang_id = $('#id_language').val();
                    var code = localStorage.getItem('submit:' + $('#id_language').val());

                    function update_submit_area(code) {
                        window.previous_template = code;
                        source.val(code);
                        window.ace_source.getSession().setValue(code);
                    }

                    if (code != null) {
                        update_submit_area(code);
                    } else {
                        $.get('{{ url('language_template_ajax') }}', {
                            id: lang_id
                        }).done(function (template) {
                            update_submit_area(template);
                        });
                    }
                }
            }

            function makeDisplayData(data) {
                var site_data = data.attr('data-info');
                var judge_data = data.attr('data-judge-info');
                var display_data = site_data || judge_data;
                return display_data;
            }

            function formatSelection(state) {
                if (!state.id) return state.text; // optgroup
                var data = makeDisplayData($("option[data-id=" + state.id + "]"));
                return $('<span>').append($('<b>').text(state.text), ' (', data, ')');
            }

            // Terrible hack, adapted from https://github.com/select2/select2/issues/4436
            $.fn.select2.amd.define('select2/data/customAdapter', ['select2/results', 'select2/utils'], function (Result, Utils) {
                RefPresenter = function ($element, options, dataAdapter) {
                    RefPresenter.__super__.constructor.call(this, $element, options, dataAdapter);
                };
                Utils.Extend(RefPresenter, Result);
                RefPresenter.prototype.bind = function (container, $container) {
                    container.on('results:focus', function (params) {
                        var data = makeDisplayData($("option[data-id=" + params.data.id + "]"));
                        $("#result-version-info").text(data);
                    });
                    RefPresenter.__super__.bind.call(this, container, $container);
                };
                return RefPresenter;
            });

            var customAdapter = $.fn.select2.amd.require('select2/data/customAdapter');

            $("#id_language").select2({
                theme: '{{ DMOJ_SELECT2_THEME }}',
                templateResult: format,
                templateSelection: formatSelection,
                resultsAdapter: customAdapter
            });

            $('#id_language').on('select2:open', function (evt) {
                var dropdown = $('.select2-dropdown');
                if (!$('#result-version-info').length)
                    dropdown.append($("<span id=\"result-version-info\">"));
                dropdown.attr('id', 'language-select2');
            });

            $('#id_judge').on('select2:open', function (evt) {
                var dropdown = $('.select2-dropdown');
                $('#result-version-info').remove();
                dropdown.attr('id', 'judge-select2');
            });

            $('#id_language').change(function () {
                var lang = $("#id_language").find("option:selected").attr('data-ace');
                window.ace_source.getSession().setMode("ace/mode/" + lang);
                update_language_template();
            });

            $('#ace_source').on('ace_load', function (e, editor) {
                update_language_template();
                editor.commands.addCommand({
                    name: 'save',
                    bindKey: {win: 'Ctrl-S', mac: 'Command-S'},
                    exec: function () {
                        localStorage.setItem('submit:' + $('#id_language').val(), editor.getSession().getValue());
                    }
                });
                editor.commands.addCommand({
                    name: 'open',
                    bindKey: {win: 'Ctrl-O', mac: 'Command-O'},
                    exec: function () {
                        $('#file_select').click();
                    }
                });
                editor.getSession().setUseWrapMode(true);
                editor.setFontSize(14);
                editor.setPrintMarginColumn(100);
                editor.focus();

                $(editor.container).on('dragover', function (e) {
                    var types = e.originalEvent.dataTransfer.types;
                    if (types && Array.prototype.indexOf.call(types, 'Files') !== -1) {
                        e.stopPropagation();
                        e.preventDefault();
                    }
                });

                $(editor.container).on('drop', function (e) {
                    e.preventDefault();
                    $('#file_select').prop('files', e.originalEvent.dataTransfer.files);
                    handleFileSelect();
                });
            });

            $(window).resize(function () {
                $('#ace_source').height(Math.max($(window).height() - 353, 100));
            }).resize();

            $('#problem_submit').submit(function (event) {
                event.preventDefault();

                if (typeof window.ace_source !== 'undefined' && window.ace_source) {
                    $('#id_source').val(window.ace_source.getSession().getValue());
                }

                if ($('#id_source').val().length > 65536) {
                    alert({{ _('Your source code must contain at most 65536 characters.')|htmltojs }});
                    return false;
                }
                
                var obj = document.getElementById('id_language');
                var fileonly = obj.options[obj.selectedIndex].getAttribute('data-fileonly');
                if (fileonly == 'True') {
                    var file_size_limit = obj.options[obj.selectedIndex].getAttribute('data-file-size');
                    var fileInput = $('#file_upload')[0];
                    if (!fileInput.files.length) {
                        alert({{ _('Vui lòng chọn tệp tin mã nguồn để nộp.')|htmltojs }});
                        return false;
                    }
                    var file = fileInput.files[0];
                    var limitBytes = parseInt(file_size_limit) * 1024 * 1024;
                    if (file.size > limitBytes) {
                        alert(({{ _('Maximum file size is {size}MB.')|htmltojs }}).replace('{size}', file_size_limit));
                        return false;
                    }
                } else {
                    if (!$('#id_source').val().trim()) {
                        alert({{ _('Vui lòng nhập mã nguồn trước khi nộp.')|htmltojs }});
                        return false;
                    }
                }

                var $submitBtn = $('#problem_submit').find(':submit');
                var originalBtnText = $submitBtn.val();
                $submitBtn.prop('disabled', true).val('{{ _("Đang gửi...") }}');

                var $popdown = $('#submit-popdown');
                $popdown.removeClass('is-collapsed');
                $('#submitPopdownBadge').attr('class', 'submit-popdown-badge is-grading').html('<i class="fa fa-spinner fa-spin"></i> <span id="submitPopdownStatusText">{{ _("Đang chấm điểm...") }}</span>');
                $('#submitPopdownScore').hide().text('');
                $('#submitPopdownDetailLink').hide().attr('href', '#');
                $('#submitPopdownLoading').show();
                $('#submitPopdownContent').hide().empty();
                $popdown.slideDown(250);

                var formEl = document.getElementById('problem_submit');
                var formData = new FormData(formEl);
                formData.set('source', $('#id_source').val());

                fetch(window.location.href, {
                    method: 'POST',
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest',
                        'Accept': 'application/json'
                    },
                    body: formData
                })
                .then(function (response) {
                    if (!response.ok) {
                        return response.json().then(function (errData) {
                            throw new Error(errData.error || '{{ _("Lỗi khi nộp bài. Vui lòng thử lại.") }}');
                        }).catch(function (err) {
                            if (err instanceof Error) throw err;
                            throw new Error('{{ _("Lỗi khi nộp bài. Vui lòng thử lại.") }}');
                        });
                    }
                    return response.json();
                })
                .then(function (data) {
                    if (data.success && data.status_url) {
                        $('#submitPopdownDetailLink').attr('href', data.status_url).show();
                        pollSubmissionPopdown(data.status_url, data.submission_id, $submitBtn, originalBtnText);
                    } else {
                        throw new Error(data.error || '{{ _("Không thể nộp bài.") }}');
                    }
                })
                .catch(function (err) {
                    $submitBtn.prop('disabled', false).val(originalBtnText);
                    $('#submitPopdownBadge').attr('class', 'submit-popdown-badge is-danger').html('<i class="fa fa-exclamation-triangle"></i> <span>{{ _("Lỗi") }}</span>');
                    $('#submitPopdownLoading').hide();
                    $('#submitPopdownContent').show().html('<div class="alert alert-danger" style="margin:0;"><i class="fa fa-exclamation-circle"></i> ' + (err.message || '{{ _("Lỗi kết nối máy chủ.") }}') + '</div>');
                });
            });

            $('#submitPopdownToggleBtn').on('click', function (e) {
                e.preventDefault();
                var $popdown = $('#submit-popdown');
                $popdown.toggleClass('is-collapsed');
                var isCollapsed = $popdown.hasClass('is-collapsed');
                $(this).find('i').attr('class', isCollapsed ? 'fa fa-chevron-down' : 'fa fa-chevron-up');
            });

            function pollSubmissionPopdown(statusUrl, submissionId, $submitBtn, originalBtnText) {
                var attempts = 0;
                var consecutive404 = 0;
                var currentDelay = 1500;
                var maxAttempts = 35;
                var pollTimeout = null;

                function bindTestcaseToggles() {
                    $('#submitPopdownContent .case-row.toggle').off('click').on('click', function (e) {
                        e.preventDefault();
                        var $row = $(this);
                        var $next = $row.next('.case-feedback');
                        if ($next.is(':visible')) {
                            $next.hide(200);
                            $row.removeClass('open').addClass('closed');
                            $row.find('.fa-chevron-down').removeClass('fa-chevron-down').addClass('fa-chevron-right');
                        } else {
                            $next.show(200);
                            $row.removeClass('closed').addClass('open');
                            $row.find('.fa-chevron-right').removeClass('fa-chevron-right').addClass('fa-chevron-down');
                        }
                    });
                }

                function checkStatus() {
                    attempts++;
                    var queryUrl = statusUrl + (statusUrl.indexOf('?') !== -1 ? '&' : '?') + '_=' + Date.now();

                    fetch(queryUrl, {
                        headers: { 'Cache-Control': 'no-cache' }
                    })
                    .then(function (res) {
                        if (res.status === 404) {
                            consecutive404++;
                            if (consecutive404 >= 5) {
                                $submitBtn.prop('disabled', false).val(originalBtnText);
                                $('#submitPopdownBadge').attr('class', 'submit-popdown-badge is-danger').html('<i class="fa fa-exclamation-circle"></i> <span>404 Not Found</span>');
                                $('#submitPopdownLoading').hide();
                                $('#submitPopdownContent').show().html('<div class="alert alert-warning" style="margin:0;"><i class="fa fa-exclamation-triangle"></i> {{ _("Chưa tìm thấy dữ liệu chấm (404). Vui lòng thử lại sau.") }}</div>');
                                return;
                            }
                            currentDelay = Math.min(5000, currentDelay + 1000);
                            pollTimeout = setTimeout(checkStatus, currentDelay);
                            return;
                        }

                        if (!res.ok) {
                            consecutive404++;
                            if (consecutive404 >= 5) {
                                $submitBtn.prop('disabled', false).val(originalBtnText);
                                $('#submitPopdownBadge').attr('class', 'submit-popdown-badge is-danger').html('<i class="fa fa-exclamation-triangle"></i> <span>{{ _("Lỗi") }}</span>');
                                return;
                            }
                            pollTimeout = setTimeout(checkStatus, 2500);
                            return;
                        }

                        consecutive404 = 0;
                        res.text().then(function (htmlText) {
                            var parser = new DOMParser();
                            var doc = parser.parseFromString(htmlText, 'text/html');
                            var testCasesEl = doc.getElementById('test-cases');

                            if (testCasesEl) {
                                $('#submitPopdownContent').html(testCasesEl.innerHTML);
                                $('#submitPopdownLoading').hide();
                                $('#submitPopdownContent').show();
                                bindTestcaseToggles();

                                var text = testCasesEl.textContent;
                                var hasSpinner = testCasesEl.querySelector('.fa-spinner, .fa-pulse') !== null;
                                var isWaiting = /waiting for a suitable judge|being processed|đang chờ|đang được xử lý|đang chấm/i.test(text);
                                var hasFinishedMarker = /(?:Final\s+(?:pretest\s+)?score|Điểm\s+(?:cuối\s+cùng|pretest|số)|Tài nguyên|Resources|Kết quả|Execution Results|Compilation (?:Error|Warnings)|Lỗi biên dịch|Cảnh báo biên dịch|Submission aborted|bị hủy)/i.test(text) || doc.querySelector('.sub-result') !== null;
                                var hasCaseRows = testCasesEl.querySelectorAll('.case-row').length > 0;
                                var isAborted = /Submission aborted|bị hủy/i.test(text);

                                var isCompleted = (!hasSpinner && !isWaiting && (hasFinishedMarker || hasCaseRows || isAborted)) || attempts >= maxAttempts;

                                if (isCompleted) {
                                    $submitBtn.prop('disabled', false).val(originalBtnText);

                                    var badCases = testCasesEl.querySelectorAll('.case-bad, .case-WA, .case-TLE, .case-MLE, .case-RTE, .case-IR, .case-OLE, .case-CE');
                                    var acCases = testCasesEl.querySelectorAll('.case-AC');
                                    var pacCases = testCasesEl.querySelectorAll('.case-PAC');
                                    var subResult = doc.querySelector('.sub-result');

                                    var badgeClass = 'is-grading';
                                    var icon = 'fa-check-circle';
                                    var verdictLabel = '{{ _("Hoàn thành") }}';

                                    if (subResult && subResult.classList.contains('AC')) {
                                        badgeClass = 'is-ac';
                                        icon = 'fa-check-circle';
                                        verdictLabel = '{{ _("Chấp nhận (AC)") }}';
                                    } else if (subResult && subResult.classList.contains('PAC')) {
                                        badgeClass = 'is-pac';
                                        icon = 'fa-adjust';
                                        verdictLabel = '{{ _("Một phần (PAC)") }}';
                                    } else if (subResult && subResult.classList.contains('CE')) {
                                        badgeClass = 'is-ce';
                                        icon = 'fa-exclamation-circle';
                                        verdictLabel = '{{ _("Lỗi biên dịch (CE)") }}';
                                    } else if (subResult && subResult.classList.contains('TLE')) {
                                        badgeClass = 'is-tle';
                                        icon = 'fa-clock-o';
                                        verdictLabel = '{{ _("Quá thời gian (TLE)") }}';
                                    } else if (subResult && subResult.classList.contains('MLE')) {
                                        badgeClass = 'is-mle';
                                        icon = 'fa-database';
                                        verdictLabel = '{{ _("Quá bộ nhớ (MLE)") }}';
                                    } else if (subResult && subResult.classList.contains('WA')) {
                                        badgeClass = 'is-wa';
                                        icon = 'fa-times-circle';
                                        verdictLabel = '{{ _("Sai kết quả (WA)") }}';
                                    } else if (subResult && (subResult.classList.contains('RTE') || subResult.classList.contains('IR') || subResult.classList.contains('OLE'))) {
                                        badgeClass = 'is-danger';
                                        icon = 'fa-exclamation-triangle';
                                        verdictLabel = '{{ _("Lỗi thực thi (RTE)") }}';
                                    } else if (testCasesEl.querySelectorAll('.case-CE').length > 0 || (/Compilation Error|Lỗi biên dịch/i.test(text) && !hasCaseRows)) {
                                        badgeClass = 'is-ce';
                                        icon = 'fa-exclamation-circle';
                                        verdictLabel = '{{ _("Lỗi biên dịch (CE)") }}';
                                    } else if (badCases.length === 0 && acCases.length > 0) {
                                        badgeClass = 'is-ac';
                                        icon = 'fa-check-circle';
                                        verdictLabel = '{{ _("Chấp nhận (AC)") }}';
                                    } else if (pacCases.length > 0 || (acCases.length > 0 && badCases.length > 0)) {
                                        badgeClass = 'is-pac';
                                        icon = 'fa-adjust';
                                        verdictLabel = '{{ _("Một phần (PAC)") }}';
                                    } else if (testCasesEl.querySelectorAll('.case-TLE').length > 0) {
                                        badgeClass = 'is-tle';
                                        icon = 'fa-clock-o';
                                        verdictLabel = '{{ _("Quá thời gian (TLE)") }}';
                                    } else if (testCasesEl.querySelectorAll('.case-MLE').length > 0) {
                                        badgeClass = 'is-mle';
                                        icon = 'fa-database';
                                        verdictLabel = '{{ _("Quá bộ nhớ (MLE)") }}';
                                    } else if (testCasesEl.querySelectorAll('.case-WA').length > 0) {
                                        badgeClass = 'is-wa';
                                        icon = 'fa-times-circle';
                                        verdictLabel = '{{ _("Sai kết quả (WA)") }}';
                                    } else if (testCasesEl.querySelectorAll('.case-RTE, .case-IR, .case-OLE').length > 0) {
                                        badgeClass = 'is-danger';
                                        icon = 'fa-exclamation-triangle';
                                        verdictLabel = '{{ _("Lỗi thực thi (RTE)") }}';
                                    } else if (isAborted) {
                                        badgeClass = 'is-danger';
                                        icon = 'fa-ban';
                                        verdictLabel = '{{ _("Bị hủy") }}';
                                    }

                                    $('#submitPopdownBadge').attr('class', 'submit-popdown-badge ' + badgeClass).html('<i class="fa ' + icon + '"></i> <span>' + verdictLabel + '</span>');

                                    var scoreMatch = text.match(/(?:Final\s+(?:pretest\s+)?score|Điểm\s+(?:cuối\s+cùng|pretest|số))[:\s]*([\d\.]+(?:\s*\/\s*[\d\.]+)?)/i);
                                    if (!scoreMatch) {
                                        scoreMatch = text.match(/\(([\d\.]+\s*\/\s*[\d\.]+)\s*(?:points|điểm|đ)\)/i);
                                    }
                                    if (scoreMatch && scoreMatch[1]) {
                                        $('#submitPopdownScore').text(scoreMatch[1].trim() + ' đ').show();
                                    }
                                    return;
                                }

                                pollTimeout = setTimeout(checkStatus, 1500);
                            } else {
                                if (attempts < maxAttempts) {
                                    pollTimeout = setTimeout(checkStatus, currentDelay);
                                } else {
                                    $submitBtn.prop('disabled', false).val(originalBtnText);
                                }
                            }
                        });
                    })
                    .catch(function (err) {
                        consecutive404++;
                        if (consecutive404 >= 5) {
                            $submitBtn.prop('disabled', false).val(originalBtnText);
                            $('#submitPopdownBadge').attr('class', 'submit-popdown-badge is-danger').html('<i class="fa fa-exclamation-triangle"></i> <span>{{ _("Lỗi kết nối") }}</span>');
                            return;
                        }
                        pollTimeout = setTimeout(checkStatus, 3000);
                    });
                }

                pollTimeout = setTimeout(checkStatus, 1200);
            }

            function on_language_change() {
                obj = document.getElementById('id_language');
                fileonly = obj.options[obj.selectedIndex].getAttribute('data-fileonly');
                if (fileonly == 'True') {
                    if (!$('#editor').hasClass('hidden')) {
                        $('#editor').addClass('hidden');
                    }
                    if ($('#file-submit').hasClass('hidden')) {
                        $('#file-submit').removeClass('hidden');
                    }

                    file_ext = '.' + obj.options[obj.selectedIndex].getAttribute('data-ext');
                    file_size_limit = obj.options[obj.selectedIndex].getAttribute('data-file-size');
                    $('#file_upload').val('');
                    $('#file_upload').attr({accept: file_ext});
                    $('#file_drag').html(
                        '<b>{{ _("Click to select a file or drag a file into this box") }}</b><br>' +
                        {{ _('`Only accept "${file_ext}". Maximum file size is ${file_size_limit}MB.`') }}
                    );
                } else {
                    if ($('#editor').hasClass('hidden')) {
                        $('#editor').removeClass('hidden');
                    }
                    if (!$('#file-submit').hasClass('hidden')) {
                        $('#file-submit').addClass('hidden');
                    }
                }
            };

            $("#id_language").change( function() {
                on_language_change();
            });

            on_language_change();

            function fileDragHover(e) {
                e.stopPropagation();
                e.preventDefault();

                if (e.type === 'dragover') {
                    $('#file_drag').addClass('hover');
                } else {
                    $('#file_drag').removeClass('hover');
                }
            }

            function fileDropHandler(e) {
                fileDragHover(e);
                $('#file_upload').prop('files', e.originalEvent.dataTransfer.files);
                handleFileChange()
            }

            $('#file_drag').on('dragover', fileDragHover);
            $('#file_drag').on('dragleave', fileDragHover);
            $('#file_drag').on('drop', fileDropHandler);
        });

        function handleFileSelect() {
            var file = $('#file_select')[0].files[0];
            if (file && window.FileReader) {
                var reader = new FileReader();
                reader.onload = function () {
                    ace_source.session.setValue(reader.result);

                    if (file.name.search('.') != -1) {
                        var ext = file.name.split('.').pop();
                        var languages = $('#id_language')[0].options;
                        for (var i = languages.length - 1; i >= 0; i--) {
                            if (languages[i].getAttribute('data-fileonly') === 'False' && languages[i].getAttribute('data-ext') === ext) {
                                $('#id_language').val(languages[i].value).change();
                                break;
                            }
                        }
                    }
                };
                reader.readAsText(file);
            }
        }

        function handleFileChange() {
            var file = $('#file_upload')[0].files[0];
            if (file) {
                $('#file_drag').html(
                    '<b>{{ _("File name") }}:</b> ' + file.name + '<br>' +
                    '<b>{{ _("File size") }}:</b> ' + (file.size / (1024 * 1024)).toFixed(2) + ' MB'
                );
            }
        }

        // https://stackoverflow.com/questions/43043113/how-to-force-reloading-a-page-when-using-browser-back-button#comment105570384_43043658
        if (window.performance.getEntriesByType("navigation")[0].type === "back_forward") {
            location.reload(true);
        }
    </script>
{% endcompress %}
